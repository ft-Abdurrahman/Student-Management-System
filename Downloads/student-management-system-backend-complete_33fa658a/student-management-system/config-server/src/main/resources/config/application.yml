# Shared defaults pulled by every service when it requests its config.
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

sms:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-256-bit-minimum-secret-please-rotate}
    issuer: sms-auth
    audience: sms-api
    access-ttl-minutes: 15
    refresh-ttl-days: 30
    refresh-ttl-days-remembered: 90
  cors:
    allowed-origins: http://localhost:3000
